apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbl-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pbl-cicd
      version: blue
  template:
    metadata:
      labels:
        app: pbl-cicd
        version: blue
    spec:
      containers:
        - name: pbl-cicd-container
          image: pbl-cicd-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000